<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4housing — Recursos Humanos</title>
<meta name="theme-color" content="#5f7a4e">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Mismo sistema visual que 4housing-adminfin / compras / EERR: paleta oliva, Archivo/Quicksand, sidebar oscuro,
   topbar blanca, cards y botones. Valores copiados de Administración y Finanzas: si allá cambian, cambiar acá. */
:root{
  --olive:#9db98b; --olive-deep:#5f7a4e; --olive-soft:#b8cdac; --olive-ink:#37432c;
  --cream:#f4f2ea; --paper:#ffffff; --ink:#2b2b26; --muted:#94917f;
  --line:#e2dfd4; --line-strong:#d3d0c4; --chip:#eceadf; --bg:#eceae1;
  --ok:#587848; --mal:#b5563f; --warn:#9a6a12;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--olive-deep);}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh;}
.app[hidden]{display:none;}
.side{width:210px;flex:none;background:#2f3a26;color:#e7ecdf;display:flex;flex-direction:column;padding:18px 13px;position:sticky;top:0;height:100vh;}
.side .brand{color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;line-height:22px;padding:0 6px 4px;}
.side .brand-sub{color:#9fb08c;font-size:11px;font-weight:600;padding:0 6px 14px;letter-spacing:.02em;}
.nav-group-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7e8a6c;font-weight:700;padding:14px 13px 5px;}
.navbtn{display:flex;align-items:center;gap:9px;background:none;border:none;color:#cdd6bf;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:left;letter-spacing:.01em;transition:.15s;width:100%;}
.navbtn[hidden]{display:none;}
.navbtn svg{width:17px;height:17px;flex:none;}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;}
.navbtn.active{background:var(--olive);color:var(--olive-ink);}
.side .sp{flex:1;}
.side .data-actions .lbl{font-size:10px;letter-spacing:.16em;color:#9fb08c;font-weight:700;margin-bottom:2px;padding:0 4px;}
.minib{background:rgba(255,255,255,.08);border:none;color:#dfe7d3;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;}
.minib svg{width:15px;height:15px;}
.minib:hover{background:rgba(255,255,255,.16);}
.autosave{font-size:10px;color:#8fa07c;text-align:center;margin-top:8px;word-break:break-all;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:14px;}
.topbar h1{margin:0;font-size:18px;font-weight:700;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.content{padding:18px 22px 48px;flex:1;}

/* ===== BOTONES ===== */
.btn{background:var(--olive-deep);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;}
.btn:hover{background:#536a44;}
.btn:disabled{opacity:.6;cursor:default;}
.btn:focus-visible,.navbtn:focus-visible,.minib:focus-visible{outline:2px solid var(--olive-deep);outline-offset:2px;}

/* ===== CARD ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px;max-width:900px;}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-h h3{margin:0;font-size:13.5px;font-weight:700;}
.card-b{padding:14px 16px;}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px;}
.nota{font-size:12.5px;color:var(--muted);margin:0 0 6px;line-height:1.5;}

/* ===== IMPORTADOR ===== */
.fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:.4rem 1rem;align-items:start;padding:11px 0;border-top:1px solid var(--line);}
.fila:first-of-type{border-top:none;}
.fila label{font-weight:600;font-size:13px;}
.est{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
.est.ok{color:var(--ok);} .est.mal{color:var(--mal);} .est.av{color:var(--warn);}
.lista{font-size:12px;margin:4px 0 0 1.1rem;padding:0;}
input[type=month]{background:#fbfaf4;border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--ink);}
input[type=month]:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,138,87,.18);background:#fff;}
input[type=file]{font-size:12.5px;color:var(--ink);max-width:100%;}

/* ===== PANTALLA DE ACCESO (login / sin sector) ===== */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
.gate[hidden]{display:none;}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 38px;max-width:380px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.10);}
.gate-card .g-brand{font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px;color:var(--olive-ink);margin-bottom:6px;}
.gate-card .g-sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
.gate-card .g-msg{font-size:14px;color:#5f5c52;margin-bottom:22px;line-height:1.5;}
.gate-card .btn{padding:12px 22px;font-size:14px;}


/* ===== COSTO POR EMPLEADO ===== */
.barra{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.barra label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px;}
.barra select,.barra input[type=search]{border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);min-width:150px;}
.barra .sp{flex:1;}
.alertas{margin-bottom:12px;}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff;max-height:calc(100vh - 250px);}
.tblwrap.chico{max-height:340px;margin-bottom:6px;}
table.tbl{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%;}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background:#fff;}
.tbl .izq{text-align:left;}
.tbl thead th{position:sticky;top:0;z-index:3;background:#f4f2ea;color:var(--olive-ink);font-weight:700;}
.tbl thead th.g{background:var(--olive-soft);text-align:center;border-left:1px solid #fff;}
.tbl thead tr.h2 th{top:31px;}
.tbl tbody tr[data-legajo]{cursor:pointer;}
.tbl tbody tr[data-legajo]:hover td{background:var(--cream);}
.tbl .c1{position:sticky;left:0;z-index:2;min-width:64px;}
.tbl .c2{position:sticky;left:64px;z-index:2;min-width:190px;box-shadow:2px 0 0 var(--line);}
.tbl thead .c1,.tbl thead .c2{z-index:4;}
.tbl tfoot td{position:sticky;bottom:0;background:#f4f2ea;font-weight:700;border-top:2px solid var(--line-strong);z-index:2;}
.tbl .neg{color:var(--mal);}
.f931-campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:6px;}
.f931-campos label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px;}
.f931-campos input{border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);text-align:right;}
.tbl tr.inf td{color:var(--muted);}
.card-h .est{margin:0;font-weight:700;}
.modal{position:fixed;inset:0;background:rgba(30,35,25,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal-card{background:#fff;border-radius:14px;max-width:940px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;position:relative;box-shadow:0 14px 44px rgba(0,0,0,.2);}
.modal-card h3{margin:0 40px 12px 0;font-size:16px;}
.modal-card h3 .sub{font-size:12px;color:var(--muted);font-weight:600;}
.modal-card h4{margin:14px 0 6px;font-size:13px;}
.modal-card .cerrar{position:absolute;top:10px;right:12px;border:none;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;}
.kpis{display:flex;gap:10px;flex-wrap:wrap;}
.kpis div{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:140px;display:flex;flex-direction:column;}
.kpis span{font-size:11px;color:var(--muted);font-weight:600;}
.kpis b{font-size:15px;}

@media(max-width:900px){
  .side{width:64px;padding:16px 8px;}
  .side .brand,.side .brand-sub,.navbtn span,.nav-group-lbl,.minib span,.autosave,.side .data-actions .lbl{display:none;}
  .navbtn,.minib{justify-content:center;}
  .topbar{flex-wrap:wrap;}
}
@media(max-width:560px){ .fila{grid-template-columns:1fr;} .content{padding:14px 12px 40px;} .topbar{padding:12px;} }
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Recursos Humanos</div><div class="g-msg">Cargando…</div></div></div>

<div class="app" id="app" hidden>
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">4housing</div>
    <div class="brand-sub">Recursos Humanos</div>
    <nav id="nav">
      <div class="nav-group-lbl">Liquidación</div>
      <button class="navbtn active" type="button" data-vista="importar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span>Importar informes</span></button>
      <button class="navbtn" type="button" data-vista="costos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16.5 5.5a3 3 0 0 1 0 5.6M18 14.3c1.9.8 3 2.6 3 5.7"/></svg><span>Costo por empleado</span></button>
      <button class="navbtn" type="button" data-vista="controles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>Controles</span></button>
    </nav>
    <div class="sp"></div>
    <div class="data-actions">
      <div class="lbl">Cuenta</div>
      <button class="minib" id="btn-salir" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
      <div class="autosave" id="who-nombre">—</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Importar informes</h1>
        <div class="sub" id="pageSub"></div>
      </div>
    </div>
    <div class="content" id="main"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script src="/portal/nav.js" defer></script>
<script src="js/rrhh-calculo.js"></script>
<script src="js/rrhh-costo-hora.js"></script>
<script src="js/rrhh-informe-costo.js"></script>
<script src="js/rrhh-vista-costos.js"></script>
<script src="js/rrhh-f931-pdf.js"></script>
<script src="js/rrhh-vista-controles.js"></script>
<script src="js/rrhh-importador.js"></script>
<script>
/* ==========================================================================
   Recursos Humanos — mismo shell de acceso que el portal y las demás apps.
   Proyecto Supabase compartido (config idéntica al portal y demás apps).
   ========================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://wcpkpwxhqdcdljfwzcmy.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_08decRYdCRUdtO5zogvJVg_VEBCN9pf',
};
const SECTOR = 'rrhh';

const $main = document.getElementById('main');
const $app  = document.getElementById('app');
const $gate = document.getElementById('gate');
let sb = null;

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// Pantalla de acceso: mismo cuadro centrado que el resto de las apps.
function pantallaAcceso(msg, btn, onClick){
  $app.hidden = true; $gate.hidden = false;
  $gate.innerHTML = '<div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Recursos Humanos</div>'
    + '<div class="g-msg">' + msg + '</div>' + (btn ? '<button class="btn" id="gate-btn" type="button">' + esc(btn) + '</button>' : '') + '</div>';
  if (btn && onClick) document.getElementById('gate-btn').addEventListener('click', onClick);
}

function vistaLogin(){
  pantallaAcceso('Ingresá con tu cuenta de Microsoft de la organización para acceder.', 'Iniciar sesión con Microsoft', async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'azure',
      options: { scopes: 'openid profile email', redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) alert('No se pudo iniciar el login: ' + error.message);
  });
}

function vistaPendiente(perfil){
  pantallaAcceso('Hola' + (perfil?.nombre ? ' <b>' + esc(perfil.nombre) + '</b>' : '') + '. Tu cuenta quedó registrada pero todavía no tiene sectores asignados. Pedile a dirección que la habilite.',
    'Cerrar sesión', salir);
}

function vistaSinSector(perfil){
  pantallaAcceso('Tu usuario (<b>' + esc(perfil.nombre || perfil.email) + '</b>) no tiene acceso al módulo de Recursos Humanos.<br><span style="font-size:12px;color:var(--muted)">Pedile a dirección que te habilite el sector «rrhh» en el portal.</span>',
    'Cerrar sesión', salir);
}

// Permisos por sección (pantalla Usuarios del portal → perfiles_sector.permisos, SECCIONES.rrhh de portal/admin.html).
// Mismo criterio que la base (rrhh_puede_ver / rrhh_puede_editar): dirección = todo; SIN lista guardada NO se ve nada
// (son sueldos: el valor por defecto es negar). Solo visión (lector) nunca edita. La base es la que manda; esto solo evita
// mostrar pantallas que después no se podrían usar.
const RRHH_SECCIONES = ['liquidacion', 'costos', 'config'];
const VISTA_SECCION = { importar: 'liquidacion', costos: 'costos', controles: 'liquidacion' };
const PERM = { ver: new Set(), editar: new Set() };
function permisosRrhh(perfil, fila){
  if (perfil.es_direccion) { RRHH_SECCIONES.forEach(x => { PERM.ver.add(x); PERM.editar.add(x); }); return; }
  const pm = (fila && fila.permisos) || {}, cargo = String((fila && fila.cargo) || '').toLowerCase();
  const ver = Array.isArray(pm.ver) ? pm.ver : [];
  const editar = ['lector', 'lectura'].includes(cargo) ? [] : Array.isArray(pm.editar) ? pm.editar : [];
  ver.forEach(x => PERM.ver.add(x));
  editar.filter(x => PERM.ver.has(x)).forEach(x => PERM.editar.add(x));
}

function vistaApp(perfil, cargo, fila){
  $gate.hidden = true; $app.hidden = false;
  document.getElementById('who-nombre').textContent = (perfil.nombre || perfil.email || '') + (cargo ? ' · ' + cargo : '');
  permisosRrhh(perfil, fila);
  document.querySelectorAll('#nav .navbtn').forEach(b => { b.hidden = !PERM.ver.has(VISTA_SECCION[b.dataset.vista]); });
  const primera = ['importar', 'costos', 'controles'].find(v => PERM.ver.has(VISTA_SECCION[v]));
  if (!primera) {
    pantallaAcceso('Tu usuario (<b>' + esc(perfil.nombre || perfil.email) + '</b>) tiene acceso a Recursos Humanos pero ninguna sección habilitada.<br><span style="font-size:12px;color:var(--muted)">Pedile a dirección que te tilde las secciones en la pantalla de Usuarios del portal.</span>',
      'Cerrar sesión', salir);
    return;
  }
  irVista(primera);
}

/* ---------- Navegación entre solapas del menú lateral ---------- */
const titulo = (t, sub) => { document.getElementById('pageTitle').textContent = t; document.getElementById('pageSub').textContent = sub || ''; };
const VISTAS = {
  importar: vistaImportar,
  costos: () => RRHHVistaCostos.montar({ sb, $main, esc, PERM, XLSX, Informe: RRHHInformeCosto, titulo }),
  controles: () => RRHHVistaControles.montar({ sb, $main, esc, PERM, Calc: RRHHCalculo, F931Pdf: RRHHF931Pdf, cargarPdfJs, titulo }),
};

// Lector de PDF (pdf.js): se carga solo cuando se sube un F.931, para no pesar en el resto de la app.
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let _pdfjs = null;
function cargarPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = PDFJS_BASE + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => { _pdfjs = null; mal(new Error('no se pudo cargar el lector de PDF')); };
    document.head.appendChild(sc);
  });
  return _pdfjs;
}
function irVista(v){
  document.querySelectorAll('#nav .navbtn').forEach(b => b.classList.toggle('active', b.dataset.vista === v));
  VISTAS[v]();
}
document.querySelectorAll('#nav .navbtn').forEach(b => b.addEventListener('click', () => irVista(b.dataset.vista)));

/* ---------------------------- Importación mensual ---------------------------- */
const ARCHIVOS = [
  { id:'res4h',  etiqueta:'Resumen de conceptos liquidados · 4H',    tipo:'resumen',   empresa:'4H' },
  { id:'resoc',  etiqueta:'Resumen de conceptos liquidados · 4H OC', tipo:'resumen',   empresa:'4H_OC' },
  { id:'nov4h',  etiqueta:'Novedades registradas · 4H',              tipo:'novedades', empresa:'4H' },
  { id:'novoc',  etiqueta:'Novedades registradas · 4H OC',           tipo:'novedades', empresa:'4H_OC' },
  { id:'padron', etiqueta:'Legajos (padrón)',                        tipo:'padron',    empresa:null },
];
const cargados = {};   // id -> { nombre, res } | { nombre, error }
let catalogo = null;   // rrhh_conceptos, se pide una vez

function periodoAnterior(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function leerExcel(file, tipo){
  if (!window.XLSX) throw new Error('No se cargó la librería para leer Excel. Revisá la conexión y recargá.');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });   // sin cellDates: las fechas llegan como número exacto
  for (const n of wb.SheetNames){
    const m = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null });
    if (RRHHImportador.pareceInforme(m, tipo)) return m;
  }
  throw new Error('No encontré ninguna hoja con el formato de este informe.');
}

function vistaImportar(){
  document.getElementById('pageTitle').textContent = 'Importar informes';
  document.getElementById('pageSub').textContent = 'Resumen de conceptos liquidados, novedades y padrón del mes';
  $main.innerHTML = `
    <div class="card">
      <div class="card-h"><h3>Informes del período</h3></div>
      <div class="card-b">
        <p class="nota">Los archivos se leen en tu navegador. Solo se envían legajo, concepto, importes y horas:
          el C.U.I.L., teléfono y correo nunca salen de tu equipo. Reimportar un informe reemplaza el anterior del mismo período.</p>
        <div class="fila"><label for="periodo">Período</label>
          <div><input type="month" id="periodo" value="${periodoAnterior()}"></div></div>
        ${ARCHIVOS.map(a => `
          <div class="fila"><label for="f-${a.id}">${esc(a.etiqueta)}</label>
            <div><input type="file" id="f-${a.id}" accept=".xlsx,.xls" data-id="${a.id}">
            <div class="est" id="est-${a.id}">Sin cargar</div></div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Controles previos</h3></div>
      <div class="card-b" id="controles-body"></div>
    </div>
    <div class="card">
      <div class="card-b">
        <button class="btn" id="btn-importar" type="button" disabled>Importar</button>
        <div id="resultado" class="est" role="status"></div>
      </div>
    </div>`;
  document.querySelectorAll('input[type=file]').forEach(i => i.addEventListener('change', alElegir));
  document.getElementById('periodo').addEventListener('change', pintarControles);
  document.getElementById('btn-importar').addEventListener('click', importar);
  pintarControles();
}

async function alElegir(ev){
  const a = ARCHIVOS.find(x => x.id === ev.target.dataset.id);
  const $est = document.getElementById('est-' + a.id);
  const file = ev.target.files[0];
  delete cargados[a.id];
  if (!file){ $est.className = 'est'; $est.textContent = 'Sin cargar'; pintarControles(); return; }
  $est.className = 'est'; $est.textContent = 'Leyendo…';
  try {
    const m = await leerExcel(file, a.tipo);
    const R = RRHHImportador;
    const res = a.tipo === 'resumen' ? R.parseResumen(m) : a.tipo === 'novedades' ? R.parseNovedades(m) : R.parsePadron(m);
    cargados[a.id] = { nombre: file.name, res };
    const partes = [res.filas.length + ' filas'];
    if (res.periodo) partes.push('período ' + res.periodo);
    let html = esc(partes.join(' · '));
    if (res.errores.length) html += '<ul class="lista">' + res.errores.slice(0, 8).map(e => '<li>' + esc(e) + '</li>').join('') +
      (res.errores.length > 8 ? '<li>… y ' + (res.errores.length - 8) + ' más</li>' : '') + '</ul>';
    if (res.advertencias.length) html += '<ul class="lista">' + res.advertencias.slice(0, 5).map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>';
    $est.className = 'est ' + (res.errores.length ? 'mal' : res.advertencias.length ? 'av' : 'ok');
    $est.innerHTML = html;
  } catch (e) {
    cargados[a.id] = { nombre: file.name, error: e.message };
    $est.className = 'est mal'; $est.textContent = e.message;
  }
  pintarControles();
}

// En la base, el lote de la liquidación se llama 'liquidacion' (en pantalla: 'resumen').
const tipoLote = a => (a.tipo === 'resumen' ? 'liquidacion' : a.tipo);
// Cargar informes exige EDITAR «liquidacion»; el padrón exige EDITAR «config».
const puedeImportar = a => PERM.editar.has(a.tipo === 'padron' ? 'config' : 'liquidacion');

function listos(){
  return ARCHIVOS.filter(a => cargados[a.id] && cargados[a.id].res && !cargados[a.id].res.errores.length);
}

async function pintarControles(){
  const $c = document.getElementById('controles-body'); if (!$c) return;
  const periodo = document.getElementById('periodo').value;
  const L = listos(), msgs = [];
  const informes = L.filter(a => a.tipo !== 'padron').map(a => ({ empresa: a.empresa, tipo: a.tipo, periodo: cargados[a.id].res.periodo }));
  const dist = informes.filter(i => i.periodo !== periodo);
  if (dist.length) msgs.push(['mal', 'Hay informes cuyo período no es ' + periodo + ': ' + dist.map(i => i.empresa + ' ' + i.tipo + ' (' + i.periodo + ')').join(', ') + '. No se pueden importar así.']);
  const falta = RRHHCalculo.controlPeriodo(informes).faltan;
  if (falta.length) msgs.push(['av', 'Todavía faltan para poder cerrar el período: ' + falta.join(', ') + '.']);

  const resumenes = L.filter(a => a.tipo === 'resumen');
  if (resumenes.length){
    if (!catalogo){
      const { data, error } = await sb.from('rrhh_conceptos').select('*');
      if (error) msgs.push(['mal', 'No pude leer el catálogo de conceptos: ' + error.message]); else catalogo = data;
    }
    if (catalogo){
      const filas = resumenes.flatMap(a => cargados[a.id].res.filas.map(f => ({ ...f, empresa: a.empresa })));
      const al = RRHHCalculo.calcularPeriodo(filas, catalogo).alertas;
      const fmt = x => x.empresa + ':' + x.nro_concepto;
      if (al.sinCatalogar.length) msgs.push(['mal', 'Conceptos sin catalogar (bloquean el cierre): ' + al.sinCatalogar.map(fmt).join(', ') + '.']);
      if (al.sinTrata.length) msgs.push(['mal', 'Conceptos sin tratamiento definido (bloquean el cierre): ' + al.sinTrata.map(fmt).join(', ') + '.']);
      if (al.trataNoSoportada.length) msgs.push(['mal', 'Conceptos con tratamiento no soportado: ' + al.trataNoSoportada.map(fmt).join(', ') + '.']);
      const pad = cargados.padron && cargados.padron.res && !cargados.padron.res.errores.length ? cargados.padron.res.filas : null;
      if (pad){
        const sp = RRHHImportador.legajosSinPadron(filas, pad);
        if (sp.length) msgs.push(['av', 'Legajos liquidados que no están en el padrón cargado: ' + sp.join(', ') + '.']);
      }
    }
  }
  const sinPermiso = L.filter(a => !puedeImportar(a));
  if (sinPermiso.length) msgs.push(['mal', 'No tenés permiso de edición para importar: ' + sinPermiso.map(a => a.etiqueta).join('; ') + ' (se necesita Editar en «' + (sinPermiso.some(a => a.tipo === 'padron') ? 'Configuración' : 'Liquidación') + '»). Pedíselo a dirección en el portal.']);
  $c.innerHTML = (msgs.length
    ? msgs.map(([k, t]) => '<div class="est ' + k + '">' + esc(t) + '</div>').join('')
    : '<div class="est ok">' + (L.length ? 'Sin alertas.' : 'Cargá al menos un archivo.') + '</div>');
  const sePuede = L.filter(puedeImportar).length && !dist.length;
  document.getElementById('btn-importar').disabled = !sePuede;
}

async function importar(){
  const periodo = document.getElementById('periodo').value;
  const $r = document.getElementById('resultado'), $b = document.getElementById('btn-importar');
  const L = listos().filter(puedeImportar);
  if (!/^\d{4}-\d{2}$/.test(periodo)){ $r.className = 'est mal'; $r.textContent = 'Elegí el período.'; return; }
  const { data: previos, error: e0 } = await sb.from('rrhh_lotes').select('empresa,tipo').eq('periodo', periodo);
  if (e0){ $r.className = 'est mal'; $r.textContent = 'No pude consultar lotes existentes: ' + e0.message; return; }
  const pisa = L.filter(a => a.tipo !== 'padron' && (previos || []).some(p => p.empresa === a.empresa && p.tipo === tipoLote(a)));
  if (pisa.length && !confirm('Ya hay datos cargados de ' + periodo + ' para: ' + pisa.map(a => a.etiqueta).join('; ') + '.\n\nSe van a REEMPLAZAR completos. ¿Continuar?')) return;
  $b.disabled = true; $r.className = 'est'; $r.innerHTML = '';
  const lineas = [];
  for (const a of L){
    const res = cargados[a.id].res;
    // Esquema oficial: la liquidación y las novedades entran por funciones que reemplazan el lote completo en una transacción;
    // el padrón se guarda en rrhh_empleados (solo legajo, nombre y departamento: no pisa tipo de pago, sede ni vínculo).
    const { error } = a.tipo === 'padron'
      ? await sb.from('rrhh_empleados').upsert(res.filas, { onConflict: 'legajo' })
      : await sb.rpc(a.tipo === 'resumen' ? 'rrhh_importar_liquidacion' : 'rrhh_importar_novedades',
                     { p_periodo: periodo, p_empresa: a.empresa, p_archivo: cargados[a.id].nombre, p_filas: res.filas });
    lineas.push(error ? ['mal', a.etiqueta + ': ERROR · ' + error.message] : ['ok', a.etiqueta + ': ' + res.filas.length + ' filas importadas']);
    $r.innerHTML = lineas.map(([k, t]) => '<div class="est ' + k + '">' + esc(t) + '</div>').join('');
    if (error) break;   // cada archivo es una transacción propia; reimportar es seguro
  }
  if (lineas.some(l => l[0] === 'mal')) $r.insertAdjacentHTML('beforeend', '<div class="est av">Los archivos anteriores a este error ya quedaron cargados. Corregí y volvé a importar: reemplaza lo anterior.</div>');
  catalogo = null; $b.disabled = false;
}

async function salir(){
  await sb.auth.signOut();
  window.location.reload();
}
document.getElementById('btn-salir').addEventListener('click', salir);

async function iniciar(){
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { vistaLogin(); return; }

  const uid = session.user.id;
  const [{ data: perfil, error: e1 }, { data: sectores, error: e2 }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('perfiles_sector').select('sector, cargo, permisos').eq('perfil_id', uid),
  ]);

  if (e1 || e2) {
    pantallaAcceso('Error cargando tu perfil: ' + esc((e1 || e2).message), 'Reintentar', () => window.location.reload());
    return;
  }
  if (!perfil || !perfil.activo) { vistaPendiente(perfil); return; }

  const propio = (sectores || []).find(s => s.sector === SECTOR);
  if (!perfil.es_direccion && !propio) { vistaSinSector(perfil); return; }

  vistaApp(perfil, perfil.es_direccion ? 'dirección' : (propio && propio.cargo), propio);
}

iniciar();
</script>
